        tr.row-entregue { background-color: #dcfce7 !important; }

        tr.row-cancelado { background-color: #e2e8f0 !important; }

        tr.row-vigencia-vencida {
            background-color: #fecaca !important;
            color: #991b1b !important;
        }

        tr.row-vigencia-vencida td {
            background-color: #fecaca !important;
            color: #991b1b !important;
            border-bottom-color: #fca5a5 !important;

        tr.row-vigencia-vencida td strong,
        tr.row-vigencia-vencida td b {

        }

            background-color: #fee2e2 !important;
            color: #991b1b !important;
            border-color: #f87171 !important;

            display: inline-block;

            border-radius: 6px;
            background: #dc2626;
            color: white !important;
            font-size: 0.75rem;
            font-weight: bold;

        .alert-card.advertir { border-left-color: #dc2626; background: #fef2f2; }
        .alert-card.multar { border-left-color: #991b1b; background: #fee2e2; }
        .alert-card.financeiro { border-left-color: var(--primary); background: #eff6ff; }
